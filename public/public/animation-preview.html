<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v17 캐릭터별 애니메이션 테스트</title><style>body{background:#0b192b;color:#fff;font-family:system-ui;margin:16px}h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#183047;border:1px solid #bd9a54;border-radius:14px;text-align:center;padding:12px}.card canvas{width:100%;max-width:256px;aspect-ratio:1}.card b{display:block;font-size:18px}.card small{color:#bfd0dd}button{background:#d8ac61;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;margin:8px 0 18px}</style></head><body><h1>별빛 원정대 · v17 8프레임 애니메이션</h1><p>각 캐릭터마다 서로 다른 PNG 8장을 68ms 간격으로 반복 재생합니다.</p><button id="toggle">일시 정지</button><div class="grid" id="grid"></div><script>const units=[['luna','루나'],['kain','카인'],['mia','미아'],['elin','엘린'],['sol','솔'],['noah','노아'],['rabbit','별토끼'],['dragon','작은 용'],['fox','숲여우'],['mooncat','달고양이'],['owl','눈부엉이'],['sunbird','햇살새']];const all=[];let play=true;document.getElementById('toggle').onclick=()=>{play=!play;document.getElementById('toggle').textContent=play?'일시 정지':'재생'};units.forEach(([key,name])=>{const card=document.createElement('div');card.className='card';const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;const b=document.createElement('b');b.textContent=name;const small=document.createElement('small');small.textContent=key+'/ · 8장 PNG';card.append(canvas,b,small);document.getElementById('grid').append(card);const imgs=Array.from({length:8},(_,i)=>{const img=new Image();img.src='/unit/'+key+'/'+key+'_'+String(i+1).padStart(2,'0')+'.png?v=19';return img});all.push([canvas.getContext('2d'),imgs]);});let frame=0;setInterval(()=>{if(play)frame=(frame+1)%8;for(const [ctx,imgs] of all){ctx.clearRect(0,0,256,256);const im=imgs[frame];if(im.complete&&im.naturalWidth)ctx.drawImage(im,0,0,256,256)}},68);</script></body></html>
